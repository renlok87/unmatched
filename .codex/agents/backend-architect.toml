## Database Schema\r
\r
### Core Entities\r
\r
```prisma\r
// User & Authentication\r
model User {\r
  id            String    @id @default(cuid())\r
  email         String    @unique\r
  username      String    @unique\r
  passwordHash  String\r
  settings      UserSettings?\r
  stats         UserStats?\r
  refreshTokens RefreshToken[]\r
  sessions      Session[]\r
  gamePlayers   GamePlayer[]\r
  createdAt     DateTime  @default(now())\r
  updatedAt     DateTime  @updatedAt\r
  deletedAt     DateTime?\r
}\r
\r
model UserSettings {\r
  id              String   @id @default(cuid())\r
  userId          String   @unique\r
  user            User     @relation(fields: [userId], references: [id])\r
  language        String   @default("en")\r
  theme           String   @default("dark")\r
  soundEnabled    Boolean  @default(true)\r
  notifications   Boolean  @default(true)\r
}\r
\r
model UserStats {\r
  id              String   @id @default(cuid())\r
  userId          String   @unique\r
  user            User     @relation(fields: [userId], references: [id])\r
  gamesPlayed     Int      @default(0)\r
  gamesWon        Int      @default(0)\r
  elo             Int      @default(1200)\r
}\r
\r
// Game Management\r
model Game {\r
  id          String     @id @default(cuid())\r
  status      GameStatus @default(LOBBY)\r
  mode        GameMode   @default(STANDARD)\r
  hostId      String\r
  players     GamePlayer[]\r
  states      GameState[]\r
  actions     GameAction[]\r
  snapshots   GameStateSnapshot[]\r
  createdAt   DateTime   @default(now())\r
  updatedAt   DateTime   @updatedAt\r
  version     Int        @default(0) // Optimistic locking\r
}\r
\r
model GamePlayer {\r
  id          String   @id @default(cuid())\r
  gameId      String\r
  game        Game     @relation(fields: [gameId], references: [id])\r
  userId      String\r
  user        User     @relation(fields: [userId], references: [id])\r
  heroId      String?\r
  isReady     Boolean  @default(false)\r
  team        String?  // For 2v2 mode\r
}\r
\r
// Game State\r
model GameState {\r
  id          String   @id @default(cuid())\r
  gameId      String\r
  game        Game     @relation(fields: [gameId], references: [id])\r
  state       Json     // Actual game state\r
  sequence    Int      // For optimistic updates\r
  createdAt   DateTime @default(now())\r
}\r
\r
model GameStateHistory {\r
  id          String   @id @default(cuid())\r
  gameId      String\r
  state       Json\r
  sequence    Int\r
  createdAt   DateTime @default(now())\r
}\r
\r
model GameAction {\r
  id          String    @id @default(cuid())\r
  gameId      String\r
  game        Game      @relation(fields: [gameId], references: [id])\r
  playerId    String\r
  actionType  String\r
  payload     Json\r
  timestamp   DateTime  @default(now())\r
}\r
\r
// Content\r
model Hero {\r
  id          String   @id @default(cuid())\r
  name        Json     // { en, ru }\r
  health      Int\r
  abilities   Json     // Hero abilities\r
  deck        Card[]\r
}\r
\r
model Card {\r
  id          String   @id @default(cuid())\r
  heroId      String\r
  hero        Hero     @relation(fields: [heroId], references: [id])\r
  name        Json\r
  type        CardType\r
  value       Int\r
  effects     Json?\r
}\r
\r
model Board {\r
  id          String   @id @default(cuid())\r
  name        Json\r
  layout      Json     // Grid configuration\r
  features    Json     // Doors, obstacles, etc.\r
}\r
\r
// Enums\r
enum GameStatus {\r
  LOBBY\r
  IN_PROGRESS\r
  PAUSED\r
  COMPLETED\r
  ABORTED\r
}\r
\r
enum GameMode {\r
  STANDARD    // 1v1\r
  FREE_FOR_ALL // 3-4 players\r
  TWO_V_TWO   // 2v2\r
}\r
\r
enum CardType {\r
  ATTACK\r
  DEFENSE\r
  MANEUVER\r
  SPECIAL\r
}\r
```\r
