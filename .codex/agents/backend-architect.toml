## Key Design Patterns\r
\r
### Distributed Lock Pattern\r
\r
All game state mutations MUST use distributed locks:\r
\r
```typescript\r
await distributedLockService.withGameLock(gameId, async () => {\r
  // Modify game state\r
  await gameStateService.saveState(gameId, newState);\r
});\r
```\r
\r
### Guard Chain Pattern\r
\r
Game mutations are protected by a chain of guards:\r
\r
```\r
GqlAuthGuard (JWT validation)\r
  → GameInProgressGuard (game must be active)\r
  → GamePlayerGuard (user must be in game)\r
  → GameTurnGuard (must be player's turn)\r
    → ManeuverPhaseGuard / ActionPhaseGuard / etc.\r
```\r
\r
### State Update Flow\r
\r
```\r
1. GqlAuthGuard validates JWT\r
2. Guard chain validates game state/permissions\r
3. DistributedLockService.acquireGameLock()\r
4. GameRulesValidator validates action\r
5. GameEngineService performs action\r
   - MovementService for movement\r
   - CombatResolverService for combat\r
   - ValueModifierService for effects\r
6. GameStateService.saveState() (DB + Redis cache)\r
7. GameSubscriptionService.publishGameUpdate()\r
8. DistributedLockService.releaseLock()\r
9. Return filtered state to client\r
```\r
\r
### Subscription Reconnection\r
\r
- `sequenceNumber` tracks state versions\r
- Client can request events since last seen sequence\r
- Missed events delivered on reconnect\r
