## Complete GraphQL API\r
\r
### Queries\r
\r
```graphql\r
type Query {\r
  # Game queries\r
  game(id: ID!): Game!\r
  myGames(filters: GameFiltersInput): GameConnection!\r
  availableGames(mode: GameMode, limit: Int): [Game!]!\r
\r
  # Game state queries\r
  gameState(gameId: ID!): GameState!\r
  gameSequence(gameId: ID!): Int!  # For optimistic updates\r
\r
  # Content queries\r
  heroes: [Hero!]!\r
  hero(id: ID!): Hero!\r
  boards: [Board!]!\r
\r
  # User queries\r
  me: User!\r
  leaderboard(options: LeaderboardOptions): LeaderboardEntryConnection!\r
}\r
```\r
\r
### Mutations\r
\r
```graphql\r
type Mutation {\r
  # Authentication\r
  register(input: RegisterInput!): AuthResponse!\r
  login(input: LoginInput!): AuthResponse!\r
  refreshToken(token: String!): AuthResponse!\r
  logout: Boolean!\r
\r
  # Game Management\r
  createGame(input: CreateGameInput!): Game!\r
  joinGame(input: JoinGameInput!): Game!\r
  leaveGame(gameId: ID!): Game!\r
  startGame(gameId: ID!): Game!\r
  abortGame(gameId: ID!): Game!\r
\r
  # Lobby Actions\r
  toggleReady(gameId: ID!): Game!\r
  selectHero(gameId: ID!, heroId: ID!): Game!\r
\r
  # Game Actions (all require distributed locks)\r
  maneuver(input: ManeuverInput!): GameState!\r
  moveFighter(input: MoveFighterInput!): GameState!\r
  attack(input: AttackInput!): GameState!\r
  playDefense(input: PlayDefenseInput!): GameState!\r
  resolveCombat(input: ResolveCombatInput!): GameState!\r
  endTurn(input: EndTurnInput!): GameState!\r
  pass(input: PassInput!): GameState!\r
  toggleDoor(input: ToggleDoorInput!): GameState!  # Bjorn special ability\r
\r
  # Profile\r
  updateProfile(input: UpdateProfileInput!): User!\r
}\r
```\r
\r
### Subscriptions\r
\r
```graphql\r
type Subscription {\r
  # Real-time game updates\r
  gameUpdates(gameId: ID!): GameUpdatePayload!\r
}\r
\r
type GameUpdatePayload {\r
  gameState: GameState!\r
  sequence: Int!\r
  eventType: GameEventType!\r
  patch: Json  # Optional state diff for efficiency\r
}\r
\r
enum GameEventType {\r
  GAME_STARTED\r
  PLAYER_JOINED\r
  PLAYER_LEFT\r
  TURN_CHANGED\r
  MANEUVER_PLAYED\r
  ATTACK_INITIATED\r
  DEFENSE_PLAYED\r
  COMBAT_RESOLVED\r
  FIGHTER_DEFEATED\r
  GAME_ENDED\r
}\r
```\r
\r
## Key Game Flows\r
\r
### Attack Flow\r
```\r
attack(gameId, attackerId, cardId, targetId)\r
  → Guards: GqlAuthGuard → GameInProgressGuard → GamePlayerGuard → ActionPhaseGuard\r
  → DistributedLockService.withGameLock()\r
  → GameRulesValidator.validateAttack()\r
    [is attacker's turn? action phase? cards adjacent? target valid?]\r
  → CombatResolverService.initiateAttack()\r
    [create "awaiting defense" state, start timeout]\r
  → GameStateService.saveState()\r
  → GameSubscriptionService.publish(ATTACK_INITIATED)\r
  → Release lock, return state\r
```\r
\r
### Defense Flow\r
```\r
playDefense(gameId, cardId)\r
  → Guards: GqlAuthGuard → GameInProgressGuard → GamePlayerGuard → IsDefenderGuard\r
  → DistributedLockService.withGameLock()\r
  → GameRulesValidator.validateDefense()\r
    [is defender? is defense card valid? within timeout?]\r
  → CombatResolverService.applyDefense()\r
  → GameStateService.saveState()\r
  → GameSubscriptionService.publish(DEFENSE_PLAYED)\r
  → Release lock, return state\r
```\r
\r
### Combat Resolution\r
```\r
resolveCombat(gameId)\r
  → Guards: GqlAuthGuard → GameInProgressGuard → GamePlayerGuard\r
  → DistributedLockService.withGameLock()\r
  → CombatResolverService.resolveCombat()\r
    [calculate damage, apply modifiers, check defeat]\r
  → Check win/loss conditions\r
  → GameStateService.saveState()\r
  → GameSubscriptionService.publish(COMBAT_RESOLVED)\r
  → Release lock, return state\r
```\r
\r
### Maneuver Flow\r
```\r
maneuver(gameId, fighterId, cardId, path)\r
  → Guards: GqlAuthGuard → GameInProgressGuard → GamePlayerGuard → ManeuverPhaseGuard\r
  → DistributedLockService.withGameLock()\r
  → GameRulesValidator.validateManeuver()\r
  → MovementService.calculatePath()\r
    [A* pathfinding with door/obstacle checks]\r
  → MovementService.applyMovement()\r
  → ValueModifierService.applyCardEffects()\r
  → GameStateService.saveState()\r
  → GameSubscriptionService.publish(MANEUVER_PLAYED)\r
  → Release lock, return state\r
```\r
\r
## Special Features\r
\r
### Combat Timeout\r
- BullMQ queue for automatic combat resolution\r
- Configurable timeout (default 30s)\r
- Auto-resolves with no defense when timeout expires\r
\r
### Pathfinding (A*)\r
- MovementService implements A* algorithm\r
- Accounts for board features (doors, obstacles)\r
- Caches calculated paths for performance\r
\r
### Privacy Filtering\r
- GameState filtered per player\r
- Hidden cards not revealed to opponents\r
- Private state (hand) only visible to owner\r
\r
## Implementation Guidelines\r
\r
When implementing new features:\r
\r
1. **Always use distributed locks** for game state mutations\r
2. **Add guards** for permission validation\r
3. **Use the guard chain** - don't duplicate logic\r
4. **Cache frequently accessed data** in Redis\r
5. **Log all actions** to GameAction for audit trail\r
6. **Consider reconnection** - use sequence numbers\r
7. **Filter private data** before returning to clients\r
8. **Test concurrent scenarios** - distributed locks must work\r
\r
