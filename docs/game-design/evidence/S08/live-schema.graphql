type Mutation {
  abortGame(gameId: String!): GameResponse!
  acceptMatch(gameId: String!): Boolean!

  """Объявить атаку на соседнего бойца (тратит 1 действие)"""
  attack(input: AttackDto!): GameMutationResult!
  banUser(id: String!): Boolean!

  """Начать манёвр: добрать карту и потратить одно действие"""
  beginManeuver(input: BeginManeuverDto!): GameMutationResult!
  changePassword(input: ChangePasswordDto!): Boolean!
  cleanupGames(input: CleanupGamesInput): CleanupGamesResultDto!
  createBoard(input: CreateBoardInput!): AdminBoard!
  createCard(input: CreateCardInput!): AdminCard!
  createGame(idempotencyKey: String, input: CreateGameDto!): GameResponse!
  createHero(input: CreateHeroInput!): AdminHero!
  declineMatch(gameId: String!): Boolean!

  """
  Отказаться от optional-выбора (только «You may …», только голова очереди)
  """
  declinePendingEffect(input: DeclinePendingEffectDto!): GameMutationResult!
  deleteAccount: Boolean!
  deleteBoard(id: String!): Boolean!
  deleteCard(id: String!): Boolean!
  deleteHero(id: String!): Boolean!

  """Выбрать лишние карты для сброса в конце хода"""
  discardToLimit(input: DiscardToLimitDto!): GameMutationResult!

  """Завершить текущий ход"""
  endTurn(input: EndTurnDto!): GameMutationResult!
  heartbeat(input: HeartbeatInput!): HeartbeatResponse!
  joinGame(input: JoinGameDto!): GameResponse!
  joinQueue(input: JoinQueueDto!): QueueStatusResponse!
  leaveAllQueues: Boolean!
  leaveGame(gameId: String!): Boolean!
  leaveQueue(mode: String!): Boolean!
  login(input: LoginDto!): AuthResponseDto!
  logout: Boolean!

  """
  Завершить начатый манёвр: необязательные BOOST и перемещения без повторного добора
  """
  maneuver(input: ManeuverDto!): GameMutationResult!

  """Прямое перемещение без манёвра запрещено"""
  moveFighter(input: MoveFighterDto!): GameMutationResult! @deprecated(reason: "Используйте beginManeuver, затем maneuver")

  """Свободный пропуск действия запрещён правилами"""
  pass(input: PassDto!): GameMutationResult! @deprecated(reason: "Выполните maneuver, attack или playScheme")

  """Сыграть карту защиты в ответ на атаку"""
  playDefense(input: PlayDefenseDto!): GameMutationResult!

  """Разыграть scheme-карту из руки (тратит 1 действие)"""
  playScheme(input: PlaySchemeDto!): GameMutationResult!
  refreshTokens(refreshToken: String!): AuthResponseDto!
  register(input: RegisterDto!): AuthResponseDto!
  removeAvatar: Boolean!
  resetPassword(newPassword: String!, token: String!): Boolean!

  """Разрешить бой и нанести урон"""
  resolveCombat(input: ResolveCombatDto!): GameMutationResult!

  """Выбор бойца/клетки для отложенного эффекта карты (MOVE/PLACE)"""
  resolvePendingEffect(input: ResolvePendingEffectDto!): GameMutationResult!
  selectHero(gameId: String!, heroId: String!): GameResponse!

  """
  Сменить стойку героя (STANCE: Alice big/small, Muhammad Ali float/sting)
  """
  setStance(input: SetStanceDto!): GameMutationResult!
  startGame(gameId: String!): GameResponse!

  """Открыть или закрыть дверь"""
  toggleDoor(input: ToggleDoorDto!): GameMutationResult!
  toggleReady(gameId: String!): GameResponse!
  unbanUser(id: String!): Boolean!
  updateBoard(id: String!, input: UpdateBoardInput!): AdminBoard!
  updateCard(id: String!, input: UpdateCardInput!): AdminCard!
  updateHero(id: String!, input: UpdateHeroInput!): AdminHero!
  updateProfile(input: UpdateProfileDto!): UserResponse!
  updateSettings(input: SettingsDto!): UserSettingsGraphql!
  updateUser(id: String!, input: UpdateUserInput!): UserDto!
  uploadAvatar(fileUrl: String!): String!
  verifyEmail(token: String!): Boolean!
}

