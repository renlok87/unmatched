<svg xmlns="http://www.w3.org/2000/svg" width="300" height="420" viewBox="0 0 300 420">
  <defs>
    <clipPath id="card-clip">
      <rect width="300" height="420" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="300" height="420" fill="#1F1F1F" clip-path="url(#card-clip)"/>

  <!-- Illustration Area (60%) -->
  <rect width="300" height="252" fill="#FFD700" clip-path="url(#card-clip)"/>

  <!-- Faction Badge -->
  <circle cx="30" cy="30" r="20" fill="#6B4C9A"/>

  <!-- Value Badge -->
  <circle cx="270" cy="25" r="15" fill="#000000"/>
  <text x="270" y="30" text-anchor="middle" fill="#FFD700" font-family="Arial" font-size="18" font-weight="bold">2</text>

  <!-- Card Title -->
  <text x="16" y="276" fill="#FFFFFF" font-family="Arial" font-size="16" font-weight="bold">BREAKTHROUGH</text>

  <!-- Card Effect -->
  <text x="16" y="300" fill="#808080" font-family="Arial" font-size="12" width="268">
    <tspan x="16" dy="0">DURING FIGHT: If MS. MARVEL started</tspan>
    <tspan x="16" dy="18"> her turn on a different space, thi</tspan>
    <tspan x="16" dy="18">s card is worth 5.</tspan>
  </text>

  <!-- Card Footer -->
  <text x="16" y="400" fill="#808080" font-family="Arial" font-size="10">MS.MARVEL • x3</text>
</svg>