<svg xmlns="http://www.w3.org/2000/svg" width="300" height="420" viewBox="0 0 300 420">
  <defs>
    <clipPath id="hero-clip">
      <rect width="300" height="420" rx="16" ry="16"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="300" height="420" fill="#2C2C2C" clip-path="url(#hero-clip)"/>

  <!-- Top Zone (15%) -->
  <rect width="300" height="63" fill="rgba(0,0,0,0.1)" clip-path="url(#hero-clip)"/>

  <!-- Logo -->
  <text x="16" y="20" fill="#FFFFFF" font-family="Arial" font-size="12" font-weight="900" letter-spacing="1">UNMATCHED</text>

  <!-- Native Name (vertical) -->
  <text x="280" y="15" fill="#FFFFFF" font-family="Arial" font-size="14" writing-mode="tb" glyph-orientation-vertical="0"></text>

  <!-- Emblem -->
  <circle cx="150" cy="210" r="60" fill="#FFFFFF" stroke="#DC143C" stroke-width="4"/>
  <text x="150" y="225" text-anchor="middle" fill="#DC143C" font-family="Arial" font-size="48">⚔</text>

  <!-- Hero Name -->
  <text x="16" y="350" fill="#FFFFFF" font-family="Arial" font-size="24" font-weight="bold" text-shadow="0px 2px 4px rgba(0,0,0,0.3)">DRACULA</text>

  <!-- Hero Role -->
  <text x="16" y="380" fill="#1E3A8A" font-family="Arial" font-size="14">Dark Lord</text>
</svg>