; Источник: ADR §3.5 (порт 8124 — G20: MCPProject (8123) и Unmatched открыты одновременно), §5.8 (dev-loop агента);
; 00-mcp-verification.md:14 (эталонный ini-блок), :58 (Live Coding); R8 §2.14, §2.16.
; Ключи проверены по UE 5.8.2:
;   UModelContextProtocolSettings — $UE/Plugins/Experimental/ModelContextProtocol/Source/ModelContextProtocolEngine/Public/ModelContextProtocolSettings.h:
;     UCLASS(config=EditorPerProjectUserSettings) (:17) → секция /Script/ModelContextProtocolEngine.ModelContextProtocolSettings;
;     ServerUrlPath (:25), ServerPortNumber uint32 = 8000 (:38), bAutoStartServer = false (:42), bEnableToolSearch = true (:46)
;   ULiveCodingSettings — $UE/Source/Developer/Windows/LiveCoding/Private/LiveCodingSettings.h:17 (config=EditorPerProjectUserSettings)
;     → секция /Script/LiveCoding.LiveCodingSettings; bEnabled, Startup (ELiveCodingStartupMode), bEnableReinstancing,
;     bAutomaticallyCompileNewClasses, bPreloadProjectModules (:23-45)
; Файл коммитится (Default*), а не Saved/Config — чтобы агентный контур воспроизводился на чистом клоне.

[/Script/ModelContextProtocolEngine.ModelContextProtocolSettings]
ServerUrlPath=/mcp
; ~/.claude.json → mcpServers.unreal-mcp-unmatched = { "type": "http", "url": "http://127.0.0.1:8124/mcp" } (ADR §3.5)
ServerPortNumber=8124
bAutoStartServer=True
; tools/list отдаёт 3 мета-тула (list_toolsets, describe_toolset, call_tool) — 00-mcp-verification.md, «Протокол» п.3
bEnableToolSearch=True

; (уточнение к ADR §3.5) Live Coding — для компиляции C++ из агента через LiveCodingToolset (ADR §5.8, спайк E0.1).
[/Script/LiveCoding.LiveCodingSettings]
bEnabled=True
Startup=AutomaticButHidden
; реинстансинг UCLASS/USTRUCT/UFUNCTION обязателен — иначе новые члены «will usually result in crashes» (R8 §2.14)
bEnableReinstancing=True
bAutomaticallyCompileNewClasses=False
bPreloadProjectModules=True
; TODO(фаза 0, E0.1): после describe_toolset(LiveCodingToolset) уточнить, нужен ли Startup=Automatic (видимая консоль)
; для получения вывода компиляции агентом; новые UFUNCTION всё равно требуют рестарта редактора (R8 §2.14, доки Unreal MCP).
