; Источник: ADR §3.5 (DefaultEngine.ini), §4.1 (таймауты сети), §4.6 (viewport client CommonUI); R8 §2.2-2.3, §2.6.
; Ключи проверены по UE 5.8.2:
;   GameInstanceClass/GameDefaultMap/GlobalDefaultGameMode — $UE/Source/Runtime/EngineSettings/Classes/GameMapsSettings.h:100,159,203;
;                                                             $UE/Config/BaseEngine.ini:13-17
;   GameViewportClientClassName                            — $UE/Config/BaseEngine.ini:132
;   [HTTP] HttpConnectionTimeout/HttpActivityTimeout       — $UE/Source/Runtime/Online/HTTP/Private/HttpModule.cpp:62-63; BaseEngine.ini:39-41
;   [WebSockets] TextMessageMemoryLimit                    — $UE/Source/Runtime/Online/WebSockets/Private/Lws/LwsWebSocketsManager.cpp:528-529
;   [WebSockets.LibWebSockets] PingPongInterval            — LwsWebSocketsManager.cpp:192-194
; ВНИМАНИЕ: в UE-ini комментарии допустимы только отдельной строкой (`;` в начале) — inline-комментарий после значения
; попадает в само значение. Поэтому пояснения ADR §3.5 вынесены в отдельные строки.
;
; (уточнение к ADR §3.5) Секции [/Script/Engine.AssetManagerSettings] и [/Script/CommonInput.CommonInputSettings]
; перенесены в DefaultGame.ini: оба класса объявлены `config=Game`
; ($UE/Source/Runtime/Engine/Classes/Engine/AssetManagerSettings.h:66;
;  $UE/Plugins/Runtime/CommonUI/Source/CommonInput/Public/CommonInputSettings.h:24) и из DefaultEngine.ini не читаются.

[/Script/EngineSettings.GameMapsSettings]
; UUmGameInstance — ADR §3.3 Core/UmGameInstance.h
GameInstanceClass=/Script/UmClient.UmGameInstance
; L_Main — единственный игровой уровень (ADR §3.4, правило (а))
GameDefaultMap=/Game/Maps/L_Main.L_Main
EditorStartupMap=/Game/Maps/L_Main.L_Main
; BP_UmGameMode : AUmGameMode (ADR §3.4 Core/)
GlobalDefaultGameMode=/Game/Core/BP_UmGameMode.BP_UmGameMode_C
bOffsetPlayerGamepadIds=False

[/Script/Engine.Engine]
; Обязательно для input routing CommonUI (R8 §2.6): UUmGameViewportClient : UCommonGameViewportClient
GameViewportClientClassName=/Script/UmClient.UmGameViewportClient

[HTTP]
; Дефолты движка 30/30 (BaseEngine.ini:40-41). Тотальный таймаут запроса — SetTimeout(FUmGraphQLRequest::TimeoutSec=15) в коде (R8 §2.2).
HttpConnectionTimeout=15
HttpActivityTimeout=20

[WebSockets]
; Дефолт 1 МБ (1024*1024); полный gameState с колодами укладывается, но запас нужен для длинных партий (R8 §2.3).
TextMessageMemoryLimit=8388608

[WebSockets.LibWebSockets]
; Транспортный ping/pong libwebsockets каждые 10 с — страховка от terminate() сервера через ~24 с (R1 §2.4).
; Прикладной graphql-transport-ws `ping` шлёт FUmGraphQLWsClient (ADR §4.1, WsAppPingIntervalSec).
PingPongInterval=10

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; Как в $UE/Templates/TP_ThirdPerson/Config/DefaultEngine.ini (UE 5.8): DX12 + SM6 по умолчанию.
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
-D3D11TargetedShaderFormats=PCD3D_SM5
+D3D11TargetedShaderFormats=PCD3D_SM5
Compiler=Default

