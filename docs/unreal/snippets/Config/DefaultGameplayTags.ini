; Источник: ADR §3.5 («DefaultGameplayTags.ini содержит только ImportTagsFromConfig=False и пустой список — источник тегов один»),
; §5.6 (таксономия), §4.3 (UmTags.h — UE_DECLARE_GAMEPLAY_TAG_EXTERN / UE_DEFINE_GAMEPLAY_TAG,
; $UE/Source/Runtime/GameplayTags/Public/NativeGameplayTags.h); R8 §2.13.
; Ключи проверены по UE 5.8.2 — $UE/Source/Runtime/GameplayTags/Classes/GameplayTagsSettings.h:
;   UCLASS(config=GameplayTags, defaultconfig) UGameplayTagsSettings : UGameplayTagsList (:102) → секция /Script/GameplayTags.GameplayTagsSettings
;   ImportTagsFromConfig (:109, «will import tags from ini files in the config/tags folder»), WarnOnInvalidTags (:113),
;   FastReplication (:129), GameplayTagList (:48, наследуется от UGameplayTagsList), GameplayTagTableList (:145)

[/Script/GameplayTags.GameplayTagsSettings]
; Config/Tags/*.ini не используются (ADR §3.5)
ImportTagsFromConfig=False
; предупреждать о ссылках на теги, которых нет в словаре (ловит опечатки в WBP_*/DA_UmCueRegistry)
WarnOnInvalidTags=True
; сетевой репликации тегов нет — клиент не UE-сервер (ADR §1.2)
FastReplication=False
; DataTable-источников тегов нет
GameplayTagTableList=

