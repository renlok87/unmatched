; Источник: ADR §3.1 (EnhancedInput — плагин по умолчанию, R8 §2.7), §3.4 (Content/UI/Input: IA_Select, IA_Cancel, IA_Confirm,
; IA_Zoom, IA_Pan, IMC_Board, IMC_Menu), §4.6 (AUmPlayerController добавляет IMC сам).
; Ключи проверены по UE 5.8.2:
;   DefaultPlayerInputClass / DefaultInputComponentClass — $UE/Source/Runtime/Engine/Classes/GameFramework/InputSettings.h:219,223;
;     дефолт в конструкторе — UPlayerInput/UInputComponent (InputSettings.cpp:52-53); редакторский модуль EnhancedInput
;     переключает их на Enhanced-классы при первом запуске (EnhancedInputEditorModule.cpp:348,357) — фиксируем явно,
;     чтобы результат не зависел от того, открывался ли проект в редакторе.
;   ConsoleKeys — $UE/Config/BaseInput.ini:16
;   EnhancedInputDeveloperSettings — $UE/Plugins/EnhancedInput/Source/EnhancedInput/Public/EnhancedInputDeveloperSettings.h:42 (config=Input),
;     bEnableUserSettings:114, bEnableWorldSubsystem:144

[/Script/Engine.InputSettings]
DefaultPlayerInputClass=/Script/EnhancedInput.EnhancedPlayerInput
DefaultInputComponentClass=/Script/EnhancedInput.EnhancedInputComponent
; Консоль (dev-команды um.* — ADR §3.3 Dev/UmDevConsole.h); в Shipping консоли нет
+ConsoleKeys=Tilde
bAltEnterTogglesFullscreen=True
bF11TogglesFullscreen=True

[/Script/EnhancedInput.EnhancedInputDeveloperSettings]
; DefaultMappingContexts не задаём: IMC_Board/IMC_Menu добавляет AUmPlayerController через
; IEnhancedInputSubsystemInterface::AddMappingContext (R8 §2.7: EnhancedInputSubsystemInterface.h:265)
; в зависимости от UI.Screen.* (ADR §4.6). Ремап клавиш игроком — вне MVP.
bEnableUserSettings=False
bEnableWorldSubsystem=False

; Legacy ActionMappings/AxisMappings не используются (ADR §3.1: EnhancedInput).
; TODO(C4-ui): после создания ассетов через UMGToolSet/DataAssetTools (ADR §5.8) — DA_UmCommonInputData
; задаёт Accept/Back CommonUI через DataTable-действия CommonUI, а не через IA_* (bEnableEnhancedInputSupport=False; R8 §2.7).
