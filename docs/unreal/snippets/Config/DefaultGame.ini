; Источник: ADR §3.5 (DefaultGame.ini: UmNetSettings, UmClientSettings, CulturesToStage), §4.1, §4.5; R1 §3 п.2; R4 §2.7.4; R2 §4.
; Ключи проверены по UE 5.8.2:
;   GeneralProjectSettings   — $UE/Source/Runtime/EngineSettings/Classes/GeneralProjectSettings.h:12 (config=Game): ProjectName, ProjectID, Description
;   AssetManagerSettings     — $UE/Source/Runtime/Engine/Classes/Engine/AssetManagerSettings.h:66 (config=Game);
;                              синтаксис строки — $UE/Config/BaseGame.ini:254-255; поля — AssetManagerTypes.h
;   CommonInputSettings      — $UE/Plugins/Runtime/CommonUI/Source/CommonInput/Public/CommonInputSettings.h:24 (config=Game),
;                              InputData:82, bEnableDefaultInputConfig:110, bEnableEnhancedInputSupport:114
;   CommonUISettings         — $UE/Plugins/Runtime/CommonUI/Source/CommonUI/Public/CommonUISettings.h:32 (config=Game), bAutoLoadData:68
;   ProjectPackagingSettings — $UE/Source/Developer/DeveloperToolSettings/Classes/Settings/ProjectPackagingSettings.h:178 (config=Game), CulturesToStage:451; имя секции — как в $UE/Config/BaseGame.ini
;   UUmNetSettings / UUmClientSettings — UDeveloperSettings с UCLASS(config=Game, defaultconfig) (ADR §3.3) → секции /Script/<Module>.<Class>
; Комментарии — только отдельными строками (см. DefaultEngine.ini).

[/Script/EngineSettings.GeneralProjectSettings]
ProjectName=Unmatched
ProjectID=(A=-527761352,B=-347113546,C=1330251430,D=820911361)
Description=Unmatched digital client (server-authoritative GraphQL client)
CompanyName=

; ---------------------------------------------------------------------------
; Сеть (ADR §3.5, §4.1). UUmNetSettings : UDeveloperSettings, модуль UmNet.
; ---------------------------------------------------------------------------
[/Script/UmNet.UmNetSettings]
; HTTP /graphql и WS graphql-transport-ws на одном origin (R1 §2.1); ws-URL выводится из ApiBaseUrl заменой схемы http→ws
ApiBaseUrl=http://localhost:3000
GraphQLPath=/graphql
; = FUmGraphQLRequest::TimeoutSec по умолчанию (ADR §4.1)
HttpTimeoutSec=15
; ожидание connection_ack после connection_init (R1 §2.4)
WsConnectionAckTimeoutSec=5
; backoff 1 с × 2^(n−1), 5 попыток (ADR §4.1 FUmGraphQLWsClient)
WsReconnectMaxAttempts=5
WsReconnectBaseDelayMs=1000
; прикладной ping протокола graphql-transport-ws каждые 10 с (ADR §4.1)
WsAppPingIntervalSec=10
; проактивный refresh: AccessExp − Now < 300 с (ADR §4.1 UUmAuthSubsystem)
ProactiveRefreshLeadSec=300

; ---------------------------------------------------------------------------
; Клиент (ADR §3.5, §4.5). UUmClientSettings : UDeveloperSettings, модуль UmClient.
; ---------------------------------------------------------------------------
[/Script/UmClient.UmClientSettings]
; корневые /assets/... раздаёт веб-фронт (R5 §2.12, R9 §3.1); реальный порт дев-фронта — 5174 (память проекта)
AssetBaseUrl=http://localhost:5174
DefaultBoardName=Cobble City
; DEFAULT_DEFENSE_TIMEOUT (R4 §2.7.4)
DefenseTimeoutSec=30
AttackerAutoResolveDelaySec=1.5
DefenderResolveButtonDelaySec=5
RefreshFullStateDebounceMs=300
; feature-flags → теги Feature.* (ADR §5.6); матчмейкинг/присутствие выключены (R2 §4.1-4.4)
bMatchmakingEnabled=False
bPresenceEnabled=False
bVsAiEnabled=False
; dev/test: фейковые транспорт/сокет UUmMockBackend (ADR §4.8, §5.8)
bMockBackend=False

; ---------------------------------------------------------------------------
; AssetManager (ADR §3.5, §4.5; перенесено из DefaultEngine.ini — см. уточнение там).
; UmHero → UUmHeroDefinition (Content/Heroes/<Set>/DA_Hero_<heroSlug>), UmBoard → UUmBoardDefinition (Content/Boards/).
; PAL_<Set> (UPrimaryAssetLabel) сканируется движком по умолчанию (BaseGame.ini:255).
; ---------------------------------------------------------------------------
[/Script/Engine.AssetManagerSettings]
+PrimaryAssetTypesToScan=(PrimaryAssetType="UmHero",AssetBaseClass=/Script/UmClient.UmHeroDefinition,bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/Heroes")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=Unknown))
+PrimaryAssetTypesToScan=(PrimaryAssetType="UmBoard",AssetBaseClass=/Script/UmClient.UmBoardDefinition,bHasBlueprintClasses=False,bIsEditorOnly=False,Directories=((Path="/Game/Boards")),SpecificAssets=,Rules=(Priority=-1,ChunkId=-1,bApplyRecursively=True,CookRule=Unknown))

; ---------------------------------------------------------------------------
; CommonUI / CommonInput (ADR §3.5, §4.6; R8 §2.6-2.7).
; ---------------------------------------------------------------------------
[/Script/CommonInput.CommonInputSettings]
; Blueprint-подкласс UCommonUIInputData (TSoftClassPtr → суффикс _C); Content/UI/Input/ (ADR §3.4)
InputData=/Game/UI/Input/DA_UmCommonInputData.DA_UmCommonInputData_C
; Experimental в 5.8 («We do not recommend attempting to ship titles with this feature») — выключено (R8 §2.7)
bEnableEnhancedInputSupport=False
; Input Config задаёт UUmUISubsystem (Game — ECommonInputMode::All, Menu/Modal — Menu; ADR §4.6) через FUIInputConfig активных виджетов
bEnableDefaultInputConfig=True
bEnableInputMethodThrashingProtection=True
bAllowOutOfFocusDeviceInput=False

[/Script/CommonUI.CommonUISettings]
bAutoLoadData=True
; TODO(C4-ui): DefaultImageResourceObject=/Game/Textures/UI/T_UI_Placeholder_Card.T_UI_Placeholder_Card после импорта (ADR §3.4 Textures/UI)

; ---------------------------------------------------------------------------
; Пакетирование: локали en + ru (R8 §2.12; ST_UI, T_Card_*_EN|RU — ADR §3.4).
; ---------------------------------------------------------------------------
[/Script/UnrealEd.ProjectPackagingSettings]
+CulturesToStage=en
+CulturesToStage=ru
