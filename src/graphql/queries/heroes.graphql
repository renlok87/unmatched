# Герои

query AllHeroes {
  heroes {
    id
    name
    health
    movement
    set
    fighterType
    sidekickCount
    sidekickHealth
    urls {
      avatar
      mini
      cardCover
    }
  }
}

query HeroDetails($id: String!) {
  hero(id: $id) {
    id
    name
    health
    movement
    set
    fighterType
    sidekickCount
    sidekickHealth
    urls {
      avatar
      mini
      cardCover
    }
    abilities {
      id
      name
      text
      trigger
    }
    cards {
      id
      title
      type
      value
      boost
      quantity
      imageUrl
      imageUrlRu
    }
  }
}

query HeroesBySet($set: String!) {
  heroesBySet(set: $set) {
    id
    name
    health
    movement
    set
    fighterType
    sidekickCount
    sidekickHealth
    urls {
      avatar
      mini
      cardCover
    }
  }
}

# STANCE: статичные опции стоек героя (id+label) из ABILITY_CONFIGS.
# Для героев без стоек возвращает [] — HUD ничего не рендерит.
query HeroStanceOptions($heroSlug: String!) {
  heroStances(heroSlug: $heroSlug) {
    id
    label
    isDefault
  }
}
