# Игровые мутации

mutation CreateGame($input: CreateGameDto!) {
  createGame(input: $input) {
    id
    mode
    status
    hostId
    phase
    currentTurn
    players {
      userId
      username
      heroId
      isReady
    }
  }
}

mutation JoinGame($input: JoinGameDto!) {
  joinGame(input: $input) {
    id
    status
    phase
    players {
      userId
      username
      heroId
      isReady
    }
  }
}

mutation LeaveGame($gameId: String!) {
  leaveGame(gameId: $gameId)
}

mutation StartGame($gameId: String!) {
  startGame(gameId: $gameId) {
    id
    status
    phase
    players {
      userId
      heroId
    }
  }
}

mutation AbortGame($gameId: String!) {
  abortGame(gameId: $gameId) {
    id
    status
  }
}

mutation ToggleReady($gameId: String!) {
  toggleReady(gameId: $gameId) {
    id
    players {
      userId
      isReady
    }
  }
}

mutation SelectHero($gameId: String!, $heroId: String!) {
  selectHero(gameId: $gameId, heroId: $heroId) {
    id
    players {
      userId
      heroId
    }
  }
}

