decided_by:                         # один ключ на файл (SKILL.md §7.2, F49); прежнее значение этапа 0 — ключ stage0
  "stage0": "delegated (ВР-реестр 2026-10-06)"
  "stage3.weights": "delegated (П3-2, П3-3; F11 пачки): лупа срослась с правой кистью (часть 4, одна часть Tripo) — цепочка arm_upper.R → arm_lower.R → hand.R → weapon.R, оправа выше кулака на weapon.R (голова кости у выхода ручки из кулака), новой кости нет; брюки обеими штанинами одной частью — cloth с leg_chains (голень брюк гнётся в колене, кромка = веса ботинок); пальто Инвернесс — cloth, рукава и пелерины у рук — стыки весов с предплечьями (правая 0,075, левая 0,1 м), полосы выреза пальто у жилета (0,03), воротника (0,02) и спины брюк (0,03) закреплены на их весах — подбор по seams разведки; правая подошва (лента-рамка) — rig.cloth_shell; оболочка пальто отклонена (копия выходит наружу на сгибах)"
  "stage3.base": "delegated (W2-c, как Beowulf): подставка двухъярусная — кольцо по высоте base_band.height_m [0,003; 0,029] (боковина нижнего яруса); в профиле импорта 7a — ue.base_material_mode vertex-mask, VertexMaskWeight 1, SideBandWeight 0; дыры верха под ботинками — rebuild_retopo_caps (4), тёмный отпечаток верха у ботинков перекрашен color_repaint (bake t3)"
  "stage3.metal": "delegated (HANDBOOK §2.4, §4.4): маска металла H2.1 — латунь оправы и горлышка лупы (часть 4 выше кулака) и цепочка часов (часть 6), target #C9A24A (brass lens палитры); look-dev класс brass, F0 из концепта этого прогона (metal_f0 self)"
  "stage3.classes": "delegated: пальто, твид (брюки, жилет, рукава, кепи) — wool_coarse одним классом (якорь largest_class); воротник, манжеты и бант кепи — linen; галстук — silk; ботинки — leather_smooth; стекло линзы и волосы — legacy_bake; ручка лупы — wood; кожа — skin (лицо, уши, шея по тону без полуплоскости — look-dev t2)"
  "stage3.teamaccent": "delegated (П3-4, П3-4a): ribbon — бант на макушке кепи (linen, часть 3) 0,17 % площади, area_share_range [0,0015; 0,12]; K2 5× спереди 0,40 %, сзади 0,35 % — screen_share_min 0,0035 (замер); галстук с K2 не виден (голова и козырёк), пальто/твид/рубашка — главные цвета, ботинки — кожа вещей в цвете концепта (как Watson)"
  "stage3.textures": "delegated (F12 пачки, textures.color_repaint): светлая полоса текстуры Tripo на тыле левой кисти (есть и в high-poly) — из соседней кожи (bake t2); тёмный отпечаток верха подставки у ботинков — из соседнего камня (bake t3)"
  "stage6.motion_source": "delegated (ДС-6; бриф этапа 6 «Sherlock is not a swordsman»): рубящий паттерн меча Beowulf на дыме этапа 3 рвал запястье (сгиб 167°) и задирал пелерину — выпад взят у древкового класса (выпад-укол Achilles r3 ← Merlin, контакт к.7) и стал коротким прямым тычком кулаком с лупой; Idle, HitReact, DeathSettle — паттерн Beowulf"
  "stage6.keys": "delegated (этап 6): правая рука в LungeAttack и DeathSettle — aim-ключи полными базисами, решены по rest прогона H2-bake (C:/tmp/sherlock-holmes-stage6/gen_spec.py): локоть на своём шарнире, излом запястья ≤ 20° только вокруг шарнира, плечо вперёд, не вбок; hips_loc нет (F112: голова hips на хвосте root, импорт FBX выбрасывает ключи положения — это и было скольжение стоп дыма этапа 3), таз только поворачивается в досягаемости прямых ног; ключ weapon.R образца HitReact снят"
  "stage6.hit_type": "delegated (§9 справочника анимации): HIT_TYPE CLAW заявки подтверждён — кулачный удар, у CLAW оба банка (CMB-HIT, CMB-LUNGE); смерть DTH-TEMPLATE; FX и звук способности, VO — нет"
NOTES: ростер после MVP вне объёма ВР-18 — запуск по запросу пользователя 2026-10-13 (волна 1a).
