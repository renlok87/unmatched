  "stage0": "delegated (ВР-реестр 2026-10-06)"
  "stage3.weights": "delegated (П3-2, П3-3): r2 на Tripo a5faa31f — лупа срослась с правой кистью (часть 5) — цепочка arm_upper.R → arm_lower.R → hand.R → weapon.R, оправа и горлышко над кулаком на weapon.R (голова кости z 0,427), новой кости нет; штанины — отдельные части 2 и 3, обычные цепочки ног (leg_chains не нужен); трубка во рту — часть 7 вместе с лицом, воротником и галстуком: zblend + rigid_outside на head, трубка жёстко с головой; пальто Инвернесс — cloth, стыки весов рукавов с предплечьями: правая 0,085 м (0,075 давала дыру 16 px), левая 0,09 м (пункт D приёмки r1: 0,1 → 0,09, клин пелерины за поднятой левой рукой −19 % по метрике силуэта; уже 0,08 — дыры seams 11 px); вырез пальто у жилета 0,03, воротника 0,02, спины штанин 0,03 м; cloth_shell не нужен"
  "stage3.base": "delegated (W2-c, как Beowulf): подставка двухъярусная — кольцо по высоте base_band.height_m [0,003; 0,029]; в профиле импорта 7a — ue.base_material_mode vertex-mask, VertexMaskWeight 1, SideBandWeight 0; дыры верха под ботинками — rebuild_retopo_caps (4, z 0,054–0,0605); тёмный и светлый ореол отпечатка верха у подошв перекрашены color_repaint (bake r2-t2)"
  "stage3.metal": "delegated (HANDBOOK §2.4, §4.4): маска металла H2.1 — латунь оправы и горлышка лупы (часть 5 выше 0,428 м) и цепочка часов (часть 8, жилет), target #C9A24A (brass lens палитры); look-dev класс brass, F0 из концепта этого прогона (metal_f0 self)"
  "stage3.classes": "delegated: пальто, твид штанин, жилет, рукава и кепи — wool_coarse одним классом (якорь largest_class); воротник и перед рубашки, манжеты, бант кепи — linen; галстук — silk; трубка и ручка лупы — wood; ботинки — leather_smooth; стекло линзы и волосы — legacy_bake; лицо, шея и кисти — skin; подставка — stone_base"
  "stage3.teamaccent": "delegated (П3-4, П3-4a): ribbon — бант на макушке кепи (linen, часть 4) 0,13 % площади, area_share_range [0,0012; 0,12]; K2 5× спереди 0,27 %, сзади 0,22 % — screen_share_min 0,0022 (замер); галстук с K2 не виден, пальто/твид/рубашка — главные цвета, ботинки — кожа вещей в цвете концепта (как Watson)"
  "stage3.textures": "delegated (F12: textures.color_repaint, textures.roughness_remap): мазок кожи текстуры Tripo на воротнике — из соседней ткани воротника (308 текселей); тёмный и светлый ореол верха подставки у подошв — из соседнего камня (3 841 и 3 175 текселей; bake r2-t2); стекло линзы — ORM.G 0,06–0,18 (57 328 текселей, класс legacy_bake читает ORM.G в UE)"
  "stage3.source": "delegated (решение оркестратору): HPG — сваренный двойник tex8k-pbr GLB (позиции = HPT, remove_doubles 1e-9, без UV и материалов): повторная выгрузка parts11 (51818ae5) разрезана по швам UV, retopo давал 282 острова и трещины у пальто; рецепт и sha — 20261021-h2-tripo/reports/hpg-welded-derivation.json; инструментальная альтернатива — опция prepare.weld_parts_m в st_prepare.py или выгрузка Studio геометрии без Pack UV"
  "stage6.motion_source": "delegated (ДС-6; бриф этапа 6 «Sherlock is not a swordsman»): рубящий паттерн меча Beowulf на дыме этапа 3 рвал запястье (сгиб 167°) и задирал пелерину — выпад взят у древкового класса (выпад-укол Achilles r3 ← Merlin, контакт к.7) и стал коротким прямым тычком кулаком с лупой; Idle, HitReact, DeathSettle — паттерн Beowulf"
  "stage6.keys": "delegated (этап 6): правая рука в LungeAttack и DeathSettle — aim-ключи полными базисами, решены по rest прогона H2-bake (C:/tmp/sherlock-holmes-stage6/gen_spec.py): локоть на своём шарнире, излом запястья ≤ 20° только вокруг шарнира, плечо вперёд, не вбок; hips_loc нет (F112: голова hips на хвосте root, импорт FBX выбрасывает ключи положения — это и было скольжение стоп дыма этапа 3), таз только поворачивается в досягаемости прямых ног; ключ weapon.R образца HitReact снят"
  "stage6.hit_type": "delegated (§9 справочника анимации): HIT_TYPE CLAW заявки подтверждён — кулачный удар, у CLAW оба банка (CMB-HIT, CMB-LUNGE); смерть DTH-TEMPLATE; FX и звук способности, VO — нет"
