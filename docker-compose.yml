services:
  postgres:
    image: postgres:16-alpine
    container_name: unmatched-postgres
    environment:
      POSTGRES_USER: unmatched
      POSTGRES_PASSWORD: password
      POSTGRES_DB: unmatched
      POSTGRES_HOST_AUTH_METHOD: md5
    ports:
      # local only, like the dev stands in docker-compose.stands.yml
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, pg_isready -U unmatched]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: unmatched-redis
    ports:
      - "127.0.0.1:6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: unmatched-backend
    environment:
      DATABASE_URL: postgresql://unmatched:password@postgres:5432/unmatched?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      JWT_SECRET: your-super-secret-jwt-key-change-in-production
      JWT_REFRESH_SECRET: your-super-secret-refresh-token-key-change-in-production
      PORT: 3000
      NODE_ENV: development
      FRONTEND_URL: http://localhost:5173
      DISABLE_CACHE: true
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: sh -c "npm rebuild bcrypt && npm run start:dev"

volumes:
  postgres_data:
  redis_data:
  backend_node_modules:
