; W4-A render decision (user, 2026-09-28): DX12/SM6 + Lumen, High as the
; acceptance reference. Report: docs/game-design/evidence/ART-004/render-dx12-lumen-2026-09-29.md
; Lumen GI/reflections need SM6 (RenderUtils.cpp DoesPlatformSupportLumenGI);
; the SM5 fallback (DX12 without SM6.6/64-bit atomics, or DX11) keeps the same
; content with no Lumen: SkyLight + SSAO ambient, SSR/reflection environment.
; Software Lumen only (no hardware ray tracing: GTX 1060 / RX 580 class).
; Shadows: CSM (r.Shadow.Virtual.Enable=0) - measured against VSM in the W4-A
; bench; VSM needs Nanite platform support (SM6 only), CSM looks the same on
; the SM5 fallback. Nanite and Substrate are NOT used (no Nanite meshes,
; r.Substrate=0); r.Nanite.ProjectEnabled stays on only because VSM platform
; support requires it. Screen percentage is pinned to 100 (G05) in
; [SystemSettings] below, above the scalability priority.
