; W4-A scalability presets (user decision 2026-09-28: High = acceptance reference
; for K1-K3 and ACC-022). Engine levels come from BaseScalability.ini (UE 5.8);
; this file only overrides what the project rules require:
;  * the key light keeps its shadow at every level (C-8: exactly one shadow
;    caster, the key). Engine ShadowQuality@0 sets r.ShadowQuality=0 (no
;    shadows at all); here @0 keeps one 1024 CSM cascade. @1 already keeps one;
;  * the game layer (zone strokes and glyphs, rings, reachable/illegal cell
;    marks, team bases) is unlit + EyeAdaptationInverse without shadows, so no
;    level switches it off or dims it (03 section 1.2, 08 section 6.2);
;  * GI per level (engine values, unchanged): @0 no Lumen (SkyLight + SSAO),
;    @1 Lumen irradiance volume (5.8 'Medium'), @2 Lumen screen probes
;    (reference), @3 Epic. Lumen needs SM6; on the SM5 fallback every level
;    renders like @0.
; Screen percentage: pinned to 100 by [SystemSettings] r.ScreenPercentage in
; DefaultEngine.ini (G05); sg.ResolutionQuality does not change it.
; Proposed UI presets 'Kachestvo grafiki' (UI-SCR-PAUSE, GD-047, not built yet):
;   Low = sg.* 0, Medium = sg.* 1, High = sg.* 2 (reference, fresh-install
;   default via DefaultGameUserSettings.ini). Epic (3) only from the console.
[ShadowQuality@0]
r.ShadowQuality=2
r.Shadow.CSM.MaxCascades=1
r.Shadow.MaxResolution=512
r.Shadow.MaxCSMResolution=1024
