[/Script/Engine.GameUserSettings]
; UE 5.8 GameUserSettings version. Existing saved user settings can override this default.
Version=5
; Normal client default preserves the ACC-022 1080p / 60 fps target.
FrameRateLimit=60.000000

; W4-A (user decision 2026-09-28): High (sg.*=2) is the acceptance reference
; for K1-K3 and ACC-022; a fresh install starts on it. A saved
; GameUserSettings.ini of an older build (sg.*=3, ResolutionQuality=0) still
; overrides this layer - the RENDER fingerprint of every SHOT records the
; effective values and the evidence tools reject non-reference frames.
; ResolutionQuality=100: the screen percentage itself is pinned by
; [SystemSettings] r.ScreenPercentage=100 in DefaultEngine.ini (G05).
[ScalabilityGroups]
sg.ResolutionQuality=100
sg.ViewDistanceQuality=2
sg.AntiAliasingQuality=2
sg.ShadowQuality=2
sg.GlobalIlluminationQuality=2
sg.ReflectionQuality=2
sg.PostProcessQuality=2
sg.TextureQuality=2
sg.EffectsQuality=2
sg.FoliageQuality=2
sg.ShadingQuality=2
sg.LandscapeQuality=2
