; VS-1 HB-05 (04-hud-spec.md §6.1, ВР-37): localization target Game - source culture en, cultures en and ru.
; Gathers the HUD string tables /Game/UI/Localization/ST_* (UStringTable assets, EN source), imports the RU translation
; ru/Game.po written by tools/s08/hud_contract/hud_strings_build.py from docs/unreal/contracts/hud/st-*.csv and
; why-reasons.json, compiles Game.locres per culture and re-exports the PO files. Run (or via hud_strings_build.py build):
;   UnrealEditor-Cmd Unmatched.uproject -run=GatherText -config=<abs path of this file> -unattended -nullrhi
; Content/ is git-ignored: Content/Localization/Game/** is committed with git add -f (HUD-RULES П9).
[CommonSettings]
SourcePath=Content/Localization/Game
DestinationPath=Content/Localization/Game
ManifestName=Game.manifest
ArchiveName=Game.archive
PortableObjectName=Game.po
ResourceName=Game.locres
NativeCulture=en
CulturesToGenerate=en
CulturesToGenerate=ru

;Gather the string table assets
[GatherTextStep0]
CommandletClass=GatherTextFromAssets
IncludePathFilters=Content/UI/Localization/*
ExcludePathFilters=Content/Localization/*
PackageFileNameFilters=*.uasset
ShouldGatherFromEditorOnlyData=false
SkipGatherCache=false

;Write Manifest
[GatherTextStep1]
CommandletClass=GenerateGatherManifest

;Write Archives
[GatherTextStep2]
CommandletClass=GenerateGatherArchive
bPurgeOldEmptyEntries=true

;Import the RU PO file
[GatherTextStep3]
CommandletClass=InternationalizationExport
bImportLoc=true

;Write Localized Text Resource
[GatherTextStep4]
CommandletClass=GenerateTextLocalizationResource

;Export PO files
[GatherTextStep5]
CommandletClass=InternationalizationExport
bExportLoc=true
